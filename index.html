<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1322">
<title>Клинок Ёми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Golos+Text:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&family=Zen+Antique&display=swap">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ava"><canvas id="ava" width="96" height="96" aria-hidden="true"></canvas><span class="lvb" id="lv">Ур. 1</span></div>
    <div class="who"><b id="nm">Ронин</b><span class="pow"><span class="kj">力</span><span id="pow">0</span></span></div>
    <div class="wallet">
      <div class="pill g"><span class="kj">金</span><span id="gold">0</span></div>
      <div class="pill s"><span class="kj">魂</span><span id="soul">0</span></div>
    </div>
  </div>
  <div class="xp" role="img" aria-label="Опыт"><i id="xpbar"></i></div>

  <div class="stage">
    <div id="game" aria-label="Герой бежит и сражается с ёкаями"></div>
    <div class="spill" id="spill"></div>
    <button class="quest" id="quest"></button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <div class="skbar frame" id="skbar"></div>

  <div class="panel frame">
    <div class="phead"><h2 id="ptitle">Рост</h2><div id="ptools"></div></div>
    <div class="pbody" id="pbody"></div>
  </div>

  <nav class="nav" role="tablist">
    <button class="nb" role="tab" id="tab-grow" aria-selected="true"><span class="kj">育</span><small>Рост</small></button>
    <button class="nb" role="tab" id="tab-gear" aria-selected="false"><span class="kj">装</span><small>Снаряжение</small></button>
    <button class="nb" role="tab" id="tab-skill" aria-selected="false"><span class="kj">技</span><small>Навыки</small></button>
    <button class="nb" role="tab" id="tab-scroll" aria-selected="false"><span class="kj">巻</span><small>Свиток</small></button>
  </nav>
</div>

<div class="modal" id="picker" hidden>
  <div class="inner" id="pinner"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
